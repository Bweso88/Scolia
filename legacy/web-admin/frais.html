<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scolia — Frais de scolarité</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D1B3E;--bg:#F2F4F9;--white:#fff;--border:#DDE2EF;--body:#4B5670;--muted:#8E99B4;--green:#059669;--red:#DC2626;--orange:#F97316;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--body);}
.page{max-width:1100px;margin:0 auto;padding:28px 20px;}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
h2{font-size:22px;font-weight:800;color:var(--navy);}
.btn{padding:10px 20px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:7px;}
.btn-green{background:var(--green);}
.btn-secondary{background:var(--bg);color:var(--navy);border:1.5px solid var(--border);}
input,select,textarea{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:inherit;font-size:14px;color:var(--navy);outline:none;background:var(--white);}
.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding:18px;background:var(--white);border:1px solid var(--border);border-radius:14px;}
.filters .f-group{display:flex;flex-direction:column;gap:4px;}
.filters label{font-size:12px;font-weight:600;color:var(--muted);}
.card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 16px;border-bottom:1px solid var(--border);background:#fafbff;}
td{padding:11px 16px;font-size:13px;border-bottom:1px solid #f0f2f8;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;}
.modal.open{display:flex;}
.modal-box{background:#fff;border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-box h3{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:20px;}
.form-row{margin-bottom:14px;}
.form-row label{display:block;font-size:13px;font-weight:600;color:var(--body);margin-bottom:5px;}
.form-row input,.form-row select,.form-row textarea{width:100%;}
.form-actions{display:flex;gap:10px;margin-top:20px;}
.alert{display:none;padding:12px 16px;border-radius:10px;margin-bottom:16px;font-weight:600;}
</style>
</head>
<body>
<div id="nav-container"></div>
<div class="page">
  <div id="alert" class="alert"></div>
  <div class="top-bar">
    <h2>Frais de scolarité</h2>
    <button class="btn" onclick="ouvrirModalCreer()">+ Ajouter une ligne</button>
  </div>

  <div class="filters">
    <div class="f-group"><label>Classe</label><select id="f-classe" onchange="onClasseChange()"><option value="">Toutes</option></select></div>
    <div class="f-group"><label>Élève</label><select id="f-eleve" onchange="charger()"><option value="">Tous</option></select></div>
    <div class="f-group"><label>Mois</label>
      <select id="f-mois" onchange="charger()">
        <option value="">Tous</option>
        <option value="9">Septembre</option><option value="10">Octobre</option><option value="11">Novembre</option>
        <option value="12">Décembre</option><option value="1">Janvier</option><option value="2">Février</option>
        <option value="3">Mars</option><option value="4">Avril</option><option value="5">Mai</option><option value="6">Juin</option>
      </select>
    </div>
    <div class="f-group"><label>Statut</label>
      <select id="f-statut" onchange="charger()">
        <option value="">Tous</option>
        <option value="non_paye">Non payé</option>
        <option value="partiel">Partiel</option>
        <option value="paye">Payé</option>
      </select>
    </div>
  </div>

  <div class="card">
    <table>
      <thead><tr><th>Élève</th><th>Mois</th><th>Dû</th><th>Payé</th><th>Statut</th><th>Date paiement</th><th>Actions</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<!-- Modal créer -->
<div class="modal" id="modal-creer">
  <div class="modal-box">
    <h3>Ajouter une ligne de frais</h3>
    <div class="form-row"><label>Élève *</label><select id="c-eleve"><option value="">— Choisir —</option></select></div>
    <div class="form-row"><label>Année scolaire *</label><input id="c-annee" placeholder="ex: 2025-2026"></div>
    <div class="form-row">
      <label>Mois *</label>
      <select id="c-mois">
        <option value="9">Septembre</option><option value="10">Octobre</option><option value="11">Novembre</option>
        <option value="12">Décembre</option><option value="1">Janvier</option><option value="2">Février</option>
        <option value="3">Mars</option><option value="4">Avril</option><option value="5">Mai</option><option value="6">Juin</option>
      </select>
    </div>
    <div class="form-row"><label>Montant dû (FCFA) *</label><input type="number" id="c-montant" min="0" step="100"></div>
    <div class="form-actions">
      <button class="btn" onclick="creer()">Enregistrer</button>
      <button class="btn btn-secondary" onclick="fermerTout()">Annuler</button>
    </div>
  </div>
</div>

<!-- Modal confirmer paiement -->
<div class="modal" id="modal-confirmer">
  <div class="modal-box">
    <h3>Confirmer le paiement</h3>
    <input type="hidden" id="conf-id">
    <div class="form-row"><label>Montant reçu (FCFA) *</label><input type="number" id="conf-montant" min="0"></div>
    <div class="form-row"><label>Date de paiement</label><input type="date" id="conf-date"></div>
    <div class="form-row"><label>Note (optionnel)</label><textarea id="conf-note" rows="2"></textarea></div>
    <div class="form-actions">
      <button class="btn btn-green" onclick="confirmerPaiement()">Confirmer</button>
      <button class="btn btn-secondary" onclick="fermerTout()">Annuler</button>
    </div>
  </div>
</div>

<script src="_base.js"></script>
<script>
fetch('_nav.html').then(r=>r.text()).then(h=>{document.getElementById('nav-container').innerHTML=h;document.querySelector('a[href="frais.html"]')?.classList.add('active');});

const moisNoms=['','Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
let tousEleves=[];

async function init(){
  try{
    const [dc,de]=await Promise.all([apiGet('/classes'),apiGet('/eleves',{par_page:200})]);
    tousEleves=de.items||[];
    const fc=document.getElementById('f-classe');
    fc.innerHTML='<option value="">Toutes</option>';
    (dc.classes||[]).forEach(c=>fc.innerHTML+=`<option value="${c.id}">${c.nom}</option>`);
    const ce=document.getElementById('c-eleve');
    ce.innerHTML='<option value="">— Choisir —</option>';
    tousEleves.forEach(e=>ce.innerHTML+=`<option value="${e.id}">${e.prenom} ${e.nom}</option>`);
    document.getElementById('conf-date').value=new Date().toISOString().split('T')[0];
    charger();
  }catch(e){showAlert(e.message,'error');}
}

function onClasseChange(){
  const cid=document.getElementById('f-classe').value;
  const fe=document.getElementById('f-eleve');
  fe.innerHTML='<option value="">Tous</option>';
  tousEleves.filter(e=>!cid||String(e.classe_id)===cid).forEach(e=>fe.innerHTML+=`<option value="${e.id}">${e.prenom} ${e.nom}</option>`);
  charger();
}

async function charger(){
  const params={page:1};
  const eid=document.getElementById('f-eleve').value; if(eid) params.eleve_id=eid;
  const mois=document.getElementById('f-mois').value; if(mois) params.mois=mois;
  const statut=document.getElementById('f-statut').value; if(statut) params.statut=statut;
  try{
    const data=await apiGet('/frais',params);
    const list=data.items||[];
    document.getElementById('tbody').innerHTML=list.length?list.map(f=>`
      <tr>
        <td style="font-weight:600;color:var(--navy)">${f.eleve_prenom||''} ${f.eleve_nom||''}</td>
        <td>${moisNoms[f.mois]||f.mois}</td>
        <td>${formatFCFA(f.montant_du)}</td>
        <td>${formatFCFA(f.montant_paye)}</td>
        <td>${badge(f.statut)}</td>
        <td style="color:var(--muted)">${f.date_paiement?formatDate(f.date_paiement):'—'}</td>
        <td>
          ${f.statut!=='paye'?`<button class="btn btn-sm btn-green" onclick="ouvrirConfirmer(${f.id},${f.montant_du})">Confirmer</button>`:'<span style="color:var(--green);font-size:12px">✓ Confirmé</span>'}
        </td>
      </tr>`).join('')
    :'<tr><td colspan="7" style="text-align:center;padding:30px;color:var(--muted)">Aucun frais trouvé.</td></tr>';
  }catch(e){showAlert(e.message,'error');}
}

function ouvrirModalCreer(){document.getElementById('modal-creer').classList.add('open');}
function ouvrirConfirmer(id,montant){
  document.getElementById('conf-id').value=id;
  document.getElementById('conf-montant').value=montant;
  document.getElementById('modal-confirmer').classList.add('open');
}
function fermerTout(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'));}

async function creer(){
  const eid=document.getElementById('c-eleve').value;
  const annee=document.getElementById('c-annee').value.trim();
  const mois=document.getElementById('c-mois').value;
  const montant=document.getElementById('c-montant').value;
  if(!eid||!annee||!montant){showAlert('Champs requis manquants.','error');return;}
  try{
    await apiPost('/frais',{eleve_id:parseInt(eid),annee_scolaire:annee,mois:parseInt(mois),montant_du:parseFloat(montant)});
    fermerTout();showAlert('Frais créé.');charger();
  }catch(e){showAlert(e.message,'error');}
}

async function confirmerPaiement(){
  const id=document.getElementById('conf-id').value;
  const montant=document.getElementById('conf-montant').value;
  if(!montant){showAlert('Montant requis.','error');return;}
  try{
    await apiPut('/frais/'+id+'/confirmer',{montant_paye:parseFloat(montant),date_paiement:document.getElementById('conf-date').value,note_admin:document.getElementById('conf-note').value.trim()||null});
    fermerTout();showAlert('Paiement confirmé.');charger();
  }catch(e){showAlert(e.message,'error');}
}

init();
</script>
</body>
</html>
