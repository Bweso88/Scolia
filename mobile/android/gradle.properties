org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Codemagic utilise `flutter: stable`, qui peut résoudre un AGP plus
# récent que celui présent lors du scaffold local (flutter create) —
# AGP 9+ ne lit plus l'ancien DSL Groovy que nos build.gradle.kts
# utilisent encore, ce qui casse la compilation. On diffère l'adoption
# le temps de migrer (docs.flutter.dev/release/breaking-changes/migrate-to-agp-9).
android.newDsl=false
