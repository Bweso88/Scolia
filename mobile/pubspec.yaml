name: scolia
description: Application mobile Scolia — Liaison scolaire Congo-Brazzaville
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  go_router: ^13.2.0
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  firebase_core: ^2.30.1
  firebase_messaging: ^14.9.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
